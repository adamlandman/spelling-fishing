<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spelling Fishing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;background:#0b3d5c;color:#123}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1000px;margin:0 auto;position:relative}
/* top bar */
#bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff8e7;border-bottom:3px solid #f2c14e}
#bar .pill{background:#fff;border:2px solid #f2c14e;border-radius:999px;padding:3px 10px;font-weight:600;font-size:15px;white-space:nowrap}
#bar .grow{flex:1}
.iconbtn{border:none;background:#fff;border:2px solid #f2c14e;border-radius:12px;font-size:18px;padding:4px 9px;cursor:pointer;font-family:inherit}
/* word panel */
#panel{background:linear-gradient(#fff8e7,#ffefc7);padding:10px 12px 12px;text-align:center;border-bottom:4px solid #e0a82e}
#controls{display:flex;justify-content:center;gap:8px;flex-wrap:nowrap;margin-bottom:10px}
.btn{font-family:inherit;font-weight:600;font-size:17px;border:none;border-radius:14px;padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.hear{background:#2a9d8f;color:#fff;font-size:20px;padding:10px 18px}
.btn.soft{background:#fff;color:#264653;border:2px solid #e0c27a}
#slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:58px}
.slot{width:44px;height:54px;border-radius:10px;background:#fff;border:3px dashed #7fb7c9;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#0b4f6c}
.slot.next{border-color:#ff8c42;border-style:solid;animation:pulse 1.1s infinite}
.slot.filled{border-style:solid;border-color:#2a9d8f;background:#e6fff9;animation:pop .35s}
.slot.auto{border:none;background:transparent;width:18px}
.slot.space{width:22px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,140,66,.5)}50%{box-shadow:0 0 0 6px rgba(255,140,66,0)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#msg{min-height:24px;margin-top:6px;font-size:18px;font-weight:600;color:#7a4b00}
/* scene */
#scene{flex:1;position:relative;overflow:hidden;background:linear-gradient(#bfe9ff 0,#e4f6ff 64px,#48b3d9 64px,#1f7fb0 45%,#0d4f7a 100%)}
#sun{position:absolute;top:8px;right:22px;width:44px;height:44px;border-radius:50%;background:#ffd23f;box-shadow:0 0 0 8px rgba(255,210,63,.3)}
.cloud{position:absolute;top:14px;height:18px;background:#fff;border-radius:20px;opacity:.9}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:26px;height:26px;top:-12px;left:10px}.cloud::after{width:20px;height:20px;top:-8px;left:30px}
#waves{position:absolute;left:0;right:0;top:54px;height:20px;pointer-events:none}
#boat{position:absolute;top:18px;width:150px;height:60px;pointer-events:none;z-index:5}
#lineSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#water{position:absolute;left:0;right:0;top:72px;bottom:0}
.weed{position:absolute;bottom:-6px;width:14px;border-radius:14px 14px 0 0;background:#2d6a4f;transform-origin:bottom center;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.bubble{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
/* fish */
.fish{position:absolute;left:0;top:0;width:118px;cursor:pointer;z-index:3;touch-action:manipulation}
.fish svg{width:118px;height:68px;display:block;transition:transform .25s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.fish.left svg{transform:scaleX(-1)}
.fish .letter{position:absolute;top:8px;left:0;width:118px;text-align:center;font-size:36px;font-weight:700;color:#fff;line-height:52px;pointer-events:none;text-shadow:0 0 3px #0a2a3d,0 0 3px #0a2a3d,0 2px 0 #0a2a3d,0 -1px 0 #0a2a3d,2px 0 0 #0a2a3d,-2px 0 0 #0a2a3d}
.fish .name{display:block;margin:-2px auto 0;width:max-content;max-width:140px;background:rgba(255,255,255,.92);border-radius:999px;padding:1px 8px;font-size:13px;font-weight:600;color:#0b3d5c;pointer-events:none}
.fish .name b{color:#d1495b}
.fish.glow svg{filter:drop-shadow(0 0 10px #fff176) drop-shadow(0 0 18px #ffeb3b)}
.fish.shake svg{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
/* overlays */
.overlay{position:absolute;inset:0;background:rgba(6,40,61,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{background:#fff8e7;border-radius:24px;padding:22px 22px 20px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 0 #e0a82e;border:4px solid #f2c14e;max-height:92%;overflow:auto}
.card h1{margin:0 0 4px;font-size:34px;color:#0b4f6c}
.card h2{margin:0 0 6px;font-size:26px;color:#0b4f6c}
.card p{margin:6px 0;font-size:17px}
.card label{display:block;text-align:left;font-weight:600;margin:12px 0 4px}
.card select{width:100%;font-family:inherit;font-size:17px;padding:8px;border-radius:12px;border:2px solid #e0c27a;background:#fff}
.btn.go{background:#ff8c42;color:#fff;font-size:22px;padding:12px 26px;margin-top:16px}
.bigword{font-size:44px;font-weight:700;color:#2a9d8f;letter-spacing:2px;margin:4px 0}
.stars{font-size:36px;letter-spacing:4px}
.list{text-align:left;font-size:16px;margin:10px 0;max-height:200px;overflow:auto;background:#fff;border-radius:12px;padding:8px 12px}
.list div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #f3e6c2}
.hide{display:none!important}
.defbox{margin:8px auto 0;max-width:560px;background:#fff;border:2px solid #9ad1d4;border-radius:12px;padding:6px 12px;font-size:17px;color:#164e63}
.defbox i,.def i{color:#8a5a00;font-weight:600;margin-right:4px}
.def{font-size:19px!important;color:#164e63;background:#fff;border-radius:12px;padding:8px 12px;margin:4px 0 8px!important}
.btn:disabled{opacity:.6}
.confetti{position:absolute;width:10px;height:14px;z-index:30;pointer-events:none;border-radius:2px}
.small{font-size:14px;color:#7a5a1a}
@media (max-width:520px){
  .slot{width:34px;height:46px;font-size:28px}
  .slot.auto{width:12px}
  .btn{font-size:15px;padding:8px 10px}
  #controls{gap:6px}
  .lbl{display:none}
  .btn.soft{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:4px 8px;line-height:1.15}
  .btn.soft .ic{font-size:19px}
  .defbox{font-size:15px}
  .btn.hear{font-size:18px;padding:9px 14px}
  .fish,.fish svg,.fish .letter{width:96px}
  .fish svg{height:56px}
  .fish .letter{font-size:30px;line-height:42px;top:7px}
  .fish .name{font-size:11.5px}
  #bar .pill{font-size:13px;padding:2px 8px}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="pill" id="roundPill">Word 1/10</span>
    <span class="pill" id="starPill">⭐ 0</span>
    <span class="pill" id="bucketPill">🪣 0</span>
    <span class="grow"></span>
    <button class="iconbtn" id="soundBtn" title="Sound effects">🔔</button>
    <button class="iconbtn" id="homeBtn" title="Menu">🏠</button>
  </div>
  <div id="panel">
    <div id="controls">
      <button class="btn hear" id="hearBtn">🔊 Hear<span class="lbl"> word</span></button>
      <button class="btn soft" id="slowBtn"><span class="ic">🐢</span> Slow</button>
      <button class="btn soft" id="defBtn"><span class="ic">📖</span> Meaning</button>
      <button class="btn soft" id="hintBtn"><span class="ic">💡</span> Hint</button>
      <button class="btn soft" id="peekBtn"><span class="ic">👀</span> Peek</button>
    </div>
    <div id="slots"></div>
    <div id="defBox" class="defbox hide"></div>
    <div id="msg">Tap a fish to catch the next letter!</div>
  </div>
  <div id="scene">
    <div id="sun"></div>
    <div class="cloud" style="left:8%;width:60px"></div>
    <div class="cloud" style="left:58%;width:50px;top:24px"></div>
    <svg id="waves" viewBox="0 0 400 20" preserveAspectRatio="none"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 T 250 10 T 300 10 T 350 10 T 400 10 V20 H0Z" fill="#48b3d9"/></svg>
    <svg id="boat" viewBox="0 0 150 60">
      <path d="M8 34 H122 L108 56 H24 Z" fill="#c8553d" stroke="#7a2e1f" stroke-width="2"/>
      <rect x="8" y="30" width="114" height="6" rx="2" fill="#f4d35e"/>
      <circle cx="58" cy="44" r="4" fill="#fff8e7"/><circle cx="76" cy="44" r="4" fill="#fff8e7"/>
      <!-- rod -->
      <line x1="96" y1="32" x2="146" y2="2" stroke="#6d4c41" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="102" cy="28" r="4" fill="#455a64"/>
    </svg>
    <svg id="lineSvg"><line id="fline" stroke="#263238" stroke-width="1.6"/><g id="hook"><path d="M0 0 V10 A5 5 0 1 1 -8 8" fill="none" stroke="#455a64" stroke-width="2.4" stroke-linecap="round"/></g></svg>
    <div id="water"></div>
  </div>

  <!-- start screen -->
  <div class="overlay" id="startScreen">
    <div class="card">
      <div style="font-size:52px">🎣</div>
      <h1>Spelling Fishing</h1>
      <p>Listen to the word, then catch the fish in the right order to spell it!</p>
      <label for="setSel">Which words?</label>
      <select id="setSel"></select>
      <label for="countSel">Words per game</label>
      <select id="countSel"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
      <button class="btn go" id="startBtn" disabled>Loading sounds…</button>
      <p class="small" id="startInfo"></p>
      <p class="small">🔊 Turn the volume up. On iPhone/iPad, also flip off the silent switch.</p>
    </div>
  </div>

  <!-- word done -->
  <div class="overlay hide" id="doneScreen">
    <div class="card">
      <h2 id="doneTitle">You caught it!</h2>
      <div class="bigword" id="doneWord"></div>
      <p class="def" id="doneDef"></p>
      <div class="stars" id="doneStars"></div>
      <button class="btn go" id="nextBtn">Next word ➜</button>
    </div>
  </div>

  <!-- round done -->
  <div class="overlay hide" id="endScreen">
    <div class="card">
      <div style="font-size:48px">🏆</div>
      <h2>Great fishing!</h2>
      <div class="stars" id="endStars"></div>
      <p id="endText"></p>
      <div class="list" id="endList"></div>
      <button class="btn go" id="againBtn">Play again</button>
      <p><button class="btn soft" id="menuBtn" style="margin-top:8px">Choose different words</button></p>
    </div>
  </div>
</div>

<script>

"though", "was", "you", "thought", "watch", "young", "three", "water", "through", "way", "time", "we", "tiny", "weather", "to", "well", "today", "went", "together", "were", "told", "what", "too", "when", "took", "where", "top", "whether", "toward", "which", "town", "while", "tree", "white", "true", "who"];

/* ---------- real fish for every letter ---------- */

/* ---------- state ---------- */
let pool=[], roundWords=[], roundIdx=0, word="", pos=0, letterMiss=0, wordMiss=0, hints=0;
let totalStars=0, roundResults=[], busy=false, sfxOn=true;
let fishes=[], nextId=1;
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const SETS=[["all","All 499 words (mixed)"]];

function buildSetMenu(){
  const sel=$("setSel"), cur=sel.value; sel.innerHTML="";
  const opts=[...SETS];
  if(tricky.length) opts.push(["tricky",`⭐ My tricky words (${tricky.length})`]);
  opts.push(["short","Short words (2–4 letters)"],["long","Long words (7+ letters)"]);
  groups.forEach(g=>opts.push(["g:"+g[0],g[1]]));
  opts.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)});
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
  $("startInfo").textContent = bucket?`Fish in your bucket so far: ${bucket} 🐟`:"Tip: turn your volume up!";
}
function wordsFor(set){
  const letters=w=>w.replace(/[^A-Za-z]/g,"");
  if(set==="tricky") return [...tricky];
  if(set==="short") return WORDS.filter(w=>{const l=letters(w).length;return l>=2&&l<=4});
  if(set==="long") return WORDS.filter(w=>letters(w).length>=7);
  if(set.startsWith("g:")){const s=set.slice(2);return WORDS.filter(w=>s.includes(w[0].toLowerCase()))}
  return WORDS.filter(w=>letters(w).length>=2);
}

  el.className="fish";

    if(!/[A-Za-z]/.test(ch)){d.classList.add("auto");if(ch===" ")d.classList.add("space");d.textContent=ch===" "?"":ch}
    else if(i<pos){d.classList.add("filled");d.textContent=ch}
    else if(i===pos)d.classList.add("next");
    s.appendChild(d);
  });
}
function skipAuto(){while(pos<word.length&&!/[A-Za-z]/.test(word[pos]))pos++}
function setMsg(t){$("msg").textContent=t}
function updateBar(){
  $("roundPill").textContent=`Word ${Math.min(roundIdx+1,roundWords.length)}/${roundWords.length}`;
  $("starPill").textContent=`⭐ ${totalStars}`;$("bucketPill").textContent=`🪣 ${bucket}`;
}

async function tapFish(f){
  if(busy||f.hooked||f.gone||!word||pos>=word.length) return;
  busy=true; f.hooked=true; actx();
  const tip=rodTip(),{w}=fishSize();
  const target={x:f.x+w*.5,y:f.y+72+30};   // water offset 72px
  // drop hook
  await tween(320,p=>setLine(tip.x+(target.x-tip.x)*p,tip.y+70+(target.y-tip.y-70)*p));
  splash();
  const need=needed();
  if(f.letter===need){
    const sx=f.x,sy=f.y;
    await tween(480,p=>{f.x=sx+(tip.x-w*.5-sx)*p;f.y=sy+(tip.y-72-20-sy)*p;f.el.style.transform=`translate(${f.x}px,${f.y}px) rotate(${-25*p}deg) scale(${1-.4*p})`;setLine(tip.x+(target.x-tip.x)*(1-p),target.y+(tip.y+10-target.y)*p)});
    f.el.style.transition="opacity .2s";f.el.style.opacity=0;setTimeout(()=>f.el.remove(),220);f.gone=true;f.dead=true;fishes=fishes.filter(x=>x!==f);
    ding(); bucket++; store.set("sf_bucket",bucket);
    pos++; skipAuto(); letterMiss=0; clearGlow();
    renderSlots(); updateBar();
    idleLine();
    if(pos>=word.length){ busy=false; wordDone(); return; }
    voice([L(f.letter)],f.letter);
    setMsg(["Nice catch!","Got it!","Great job!","Reel 'em in!","Yes!"][Math.random()*5|0]+" What comes next?");
    setTimeout(()=>{fillPond(true)},300);
  } else {
    f.el.classList.add("shake"); boop();
    letterMiss++; wordMiss++;
    voice(["p:oops",L(f.letter),0.15,"p:try"],"Oops, try again");
    setMsg(`That's ${f.letter.toUpperCase()} for ${f.name}. Try again!`);
    await new Promise(r=>setTimeout(r,420));
    f.el.classList.remove("shake");
    await tween(260,p=>setLine(target.x+(tip.x-target.x)*p,target.y+(tip.y+70-target.y)*p));
    f.hooked=false; f.vx=(Math.random()<.5?-1:1)*(70+Math.random()*30);
    setTimeout(()=>{f.vx=Math.sign(f.vx)*(28+Math.random()*38)},1500);
    if(letterMiss>=2){glowNeeded();setMsg("Look for the glowing fish! ✨")}
  }
  busy=false;
}
function glowNeeded(){ensureNeeded();const n=needed();liveFish().forEach(f=>f.el.classList.toggle("glow",f.letter===n))}
function clearGlow(){fishes.forEach(f=>f.el.classList.remove("glow"))}

function startWord(){
  word=roundWords[roundIdx]; pos=0; letterMiss=0; wordMiss=0; hints=0;
  skipAuto(); renderSlots(); updateBar(); clearGlow(); $("defBox").classList.add("hide");
  setMsg("Listen, then catch the letters in order!");
  // refresh pond: let a few fish swim away, bring new ones
  clearPond();
  setTimeout(()=>{fillPond(true)},250);
  setTimeout(()=>sayWord(),300);
}
function starsFor(){const m=wordMiss+hints*1.5;return m===0?3:m<=2?2:1}
function wordDone(){
  const st=starsFor(); totalStars+=st; roundResults.push([word,st]);
  // tricky-word tracking
  if(st<3){ if(!tricky.includes(word)) tricky.push(word); }
  else tricky=tricky.filter(w=>w!==word);
  store.set("sf_tricky",tricky);
  updateBar(); fanfare(); confetti();
  $("doneWord").textContent=word;
  $("doneDef").innerHTML=defHTML(word);
  $("doneStars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
  $("doneTitle").textContent=st===3?"Perfect catch!":st===2?"Nice fishing!":"You did it!";
  $("nextBtn").textContent=roundIdx+1>=roundWords.length?"See my score 🏆":"Next word ➜";
  setTimeout(()=>$("doneScreen").classList.remove("hide"),500);
  const seq=["b:"+word,0.35];[...word].filter(c=>/[A-Za-z]/.test(c)).forEach(c=>seq.push(L(c),0.08));
  seq.push(0.3,"b:"+word,0.5,"d:"+word,0.4,st===3?"p:perfect":"p:great");
  setTimeout(()=>voice(seq,word),450);
}
function endRound(){
  const max=roundWords.length*3;
  $("endStars").textContent=`⭐ ${totalStars} / ${max}`;
  const perfect=roundResults.filter(r=>r[1]===3).length;
  $("endText").textContent=`${perfect} perfect catches out of ${roundWords.length} words!`;
  $("endList").innerHTML=roundResults.map(([w,s])=>`<div><span>${w}</span><span>${"⭐".repeat(s)}</span></div>`).join("");
  $("endScreen").classList.remove("hide"); fanfare();
  voice(["p:fishing"],"Great fishing!");
}
function startRound(){
  actx();
  const set=$("setSel").value, n=+$("countSel").value;
  pool=wordsFor(set); if(!pool.length) pool=wordsFor("all");
  roundWords=shuffle([...pool]).slice(0,Math.min(n,pool.length));
  roundIdx=0; totalStars=0; roundResults=[];
  ["startScreen","endScreen","doneScreen"].forEach(id=>$(id).classList.add("hide"));
  // unlock speech on iOS with a user gesture
  unlockAudio();
  voice(["p:go"],"Let's go fishing!");
  setTimeout(startWord,1500);
}

/* ---------- confetti ---------- */
function confetti(){
  const cols=["#ff8c42","#ffd23f","#2a9d8f","#e63946","#7b8cde","#90e0ef"];
  for(let i=0;i<60;i++){
    const c=document.createElement("div");c.className="confetti";c.style.background=cols[i%cols.length];
    const x=innerWidth/2,y=innerHeight*.35;c.style.left=x+"px";c.style.top=y+"px";document.body.appendChild(c);
    const a=Math.random()*Math.PI*2,v=120+Math.random()*260,vx=Math.cos(a)*v,vy=Math.sin(a)*v-220,r=Math.random()*720;
    const s=performance.now();
    (function step(n){const t=(n-s)/1000;if(t>1.6){c.remove();return}
      c.style.transform=`translate(${vx*t}px,${vy*t+420*t*t}px) rotate(${r*t}deg)`;c.style.opacity=1-t/1.6;requestAnimationFrame(step)})(s);
  }
}

/* ---------- buttons ---------- */
$("hearBtn").onclick=()=>{actx();word&&sayWord()};
$("slowBtn").onclick=()=>{actx();word&&sayWord(true)};
$("hintBtn").onclick=()=>{if(!word||pos>=word.length)return;hints++;glowNeeded();voice(["p:next",L(needed())],"next letter");setMsg(`Hint: find the ${needed().toUpperCase()} fish! ✨`)};
$("peekBtn").onclick=()=>{
  if(!word)return;hints++;const s=$("slots");const old=s.innerHTML;
  s.innerHTML=`<div class="bigword" style="font-size:38px;margin:0">${word}</div>`;
  setTimeout(()=>{renderSlots()},1500);
};
$("startBtn").onclick=startRound;
function defHTML(w){const d=DEFS[w];return d?`<i>${d[0]}</i> ${d[1]}`:""}
$("defBtn").onclick=()=>{actx();if(!word)return;const b=$("defBox");b.innerHTML="📖 "+defHTML(word);b.classList.remove("hide");voice(["p:means","d:"+word],DEFS[word]?DEFS[word][1]:"");};
$("nextBtn").onclick=()=>{$("doneScreen").classList.add("hide");roundIdx++;if(roundIdx>=roundWords.length){word="";endRound()}else startWord()};
$("againBtn").onclick=()=>{buildSetMenu();startRound()};
$("menuBtn").onclick=()=>{buildSetMenu();$("endScreen").classList.add("hide");$("startScreen").classList.remove("hide")};
$("homeBtn").onclick=()=>{stopVoice();buildSetMenu();["endScreen","doneScreen"].forEach(id=>$(id).classList.add("hide"));$("startScreen").classList.remove("hide")};
$("soundBtn").onclick=()=>{sfxOn=!sfxOn;$("soundBtn").textContent=sfxOn?"🔔":"🔕"};
addEventListener("resize",()=>{positionBoat();computeLanes();fishes.forEach(f=>{f.baseY=laneY(f.lane%laneCount)})});

/* ---------- boot ---------- */
decorate(); buildSetMenu();
requestAnimationFrame(()=>{positionBoat();computeLanes();word="";
  // ambient fish behind the start screen
  for(let i=0;i<fishCount();i++) spawnFish(randomLetter(),false);
  requestAnimationFrame(loop);
});
</script>
